<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa | Floripa Urbana</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  <style>
    .topo{position:relative;z-index:2}
    .secao-mapa{position:relative;z-index:1;max-width:none;width:100%;padding:56px 0 0;margin-top:-50px}
    .mapa-intro{max-width:1200px;margin:0 auto;padding:0 24px 24px}
    .mapa-intro h1{margin-top:8px}
    .mapa-container{width:100%;height:min(78vh,900px);min-height:500px;overflow:hidden;border-top:1px solid #dce5df;border-bottom:1px solid #dce5df}
    .mapa-container iframe{display:block;width:100%;height:100%;border:0}
    @media(max-width:600px){.mapa-container{height:72vh;min-height:420px}}
  </style>
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">Floripa Urbana</a>
    <nav><a href="{{ url_for('inicio') }}">Início</a></nav>
  </header>
  <main class="secao secao-mapa">
    <div class="mapa-intro">
      <p class="sobretitulo">Explore a ilha</p>
      <h1>Mapa de Florianópolis</h1>
      <p>Arraste para navegar e use os controles para aproximar. Selecione um marcador para ver o ponto turístico.</p>
    </div>
    <div class="mapa-container">
      <iframe title="Mapa interativo de Florianópolis" srcdoc="{{ mapa_html }}"></iframe>
    </div>
  </main>
  <footer>Floripa Urbana · Florianópolis, Santa Catarina</footer>
</body>
</html>
