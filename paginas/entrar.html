<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Floripa Urbana</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('inicio') }}">Floripa Urbana</a>
    <nav>
      <a href="{{ url_for('inicio') }}">Voltar ao início</a>
    </nav>
  </header>

  <main class="secao conta">
    <p class="sobretitulo">Que bom ter você de volta</p>
    <h1>Entrar na sua conta</h1>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
      {% endfor %}
    {% endwith %}

    <form class="formulario" action="{{ url_for('entrar') }}" method="post">
      <input type="hidden" name="next" value="{{ next }}">

      <label>
        E-mail
        <input type="email" name="email" autocomplete="email" required>
      </label>

      <label>
        Senha
        <input type="password" name="senha" autocomplete="current-password" required>
      </label>

      <button class="botao" type="submit">Entrar</button>
      <p>Ainda não tem conta? <a href="{{ url_for('cadastro', next=next) }}">Cadastre-se</a></p>
    </form>
  </main>

  <footer>Floripa Urbana</footer>
</body>
</html>
